name: Build installers

# A tag starting with v builds installers on real macOS, Windows and Linux
# machines, then attaches them to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Without this the workflow token is read-only and publishing fails with 403.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # .dmg for Apple Silicon and Intel
            script: dist:mac
          - os: windows-latest    # .exe setup wizard
            script: dist:win
          - os: ubuntu-latest     # AppImage + .deb
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

      # macOS gets its own step: hdiutil cannot reliably handle two disk images
      # at once on the runners, so build one architecture at a time and retry.
      - name: Build macOS installers
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          build_arch () {
            for attempt in 1 2 3; do
              echo "::group::$1 attempt $attempt"
              npm run dist:mac -- --$1 --publish never && { echo "::endgroup::"; return 0; }
              echo "::endgroup::"
              echo "$1 build failed on attempt $attempt, cleaning up and retrying"
              for vol in /Volumes/Safelight*; do
                [ -d "$vol" ] && hdiutil detach "$vol" -force || true
              done
              sleep 20
            done
            return 1
          }
          build_arch arm64
          build_arch x64

      - name: Build installers
        if: runner.os != 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: safelight-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true