name: Build installers

# A tag starting with v builds installers on real macOS, Windows and Linux
# machines, then attaches them to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Without this the workflow token is read-only and publishing fails with 403.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # .dmg for Apple Silicon and Intel
            script: dist:mac
          - os: windows-latest    # .exe setup wizard
            script: dist:win
          - os: ubuntu-latest     # AppImage + .deb
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # --publish never: build only. The release job below does the uploading,
      # so three parallel jobs never fight over the same release.
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: safelight-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true